<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b7e8fa"><title>Stack Stupid 🐾</title><style>*{box-sizing:border-box}body{margin:0;background:#a9e3fa;font-family:system-ui;text-align:center;color:#543c62;touch-action:none}#wrap{position:relative;margin:auto;width:min(100vw,440px);height:100dvh;overflow:hidden;background:linear-gradient(#9ddfff 0%,#eaf9ff 72%,#b6e6a0 72%)}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-around;font-weight:900;font-size:21px;text-shadow:0 2px white;pointer-events:none}#overlay{position:absolute;inset:0;background:#ffffffbd;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}h1{font-size:40px;margin:5px;color:#fa658b;text-shadow:2px 3px white}button{border:0;border-radius:30px;background:#ff7eaa;color:white;padding:16px 32px;font-size:22px;font-weight:900;box-shadow:0 6px #d44e83;margin:8px}p{font-weight:650}#shop{font-size:14px;background:white;color:#654;border-radius:12px;padding:9px}#hint{position:absolute;bottom:10px;left:0;right:0;font-size:14px;font-weight:700;color:#674b72;pointer-events:none}</style><div id="wrap"><canvas id="game"></canvas><div id="hud"><span id="hearts">❤️❤️❤️</span><span id="score">0 m</span></div><div id="hint">Drag to move the tower • Catch the falling animals!</div><div id="overlay"><h1>🐾 STACK STUPID!</h1><p>Catch adorable falling animals!<br>Build the tallest, wobbliest tower.<br>Miss 3 animals and it's game over.</p><button id="play">PLAY ▶</button><div id="shop">🚫 No Ads $1.99 (coming soon)<br>🎬 Rewarded ads (coming soon)</div></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),wrap=document.querySelector('#wrap'),overlay=document.querySelector('#overlay');let W=400,H=800,dpr=1,tower=[],fall=null,lives=3,running=false,baseX=200,moveX=200,last=0,elapsed=0,best=Number(localStorage.getItem('stackstupidbest')||0),camera=0;
const animals=[['🐱','#ffd0ab','meow'],['🐶','#cba780','woof'],['🐰','#fff0f6','squeak'],['🐼','#f7f7f7','puff'],['🐸','#a8eb96','ribbit'],['🦊','#ffbd83','yip'],['🐻','#c7a182','growl'],['🐨','#b7c8d1','puff'],['🐷','#ffbed3','oink'],['🐹','#efc69c','squeak']];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);baseX=moveX=W/2}addEventListener('resize',resize);resize();
function sound(type){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);let f={meow:560,woof:180,squeak:850,puff:290,ribbit:120,yip:700,growl:95,oink:260}[type]||400;o.type=type==='woof'||type==='growl'?'sawtooth':'sine';o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,a.currentTime+.18);g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.23);o.onended=()=>a.close()}catch(e){}}
function spawn(){const type=Math.floor(Math.random()*animals.length);fall={x:35+Math.random()*(W-70),y:-55,type,pose:Math.floor(Math.random()*5),speed:90+tower.length*15,angle:Math.random()*1.2-0.6}}
function start(){tower=[];fall=null;lives=3;camera=0;elapsed=0;baseX=moveX=W/2;running=true;overlay.style.display='none';spawn();last=performance.now();requestAnimationFrame(frame)}
function end(){running=false;let n=tower.length;best=Math.max(best,n);localStorage.setItem('stackstupidbest',best);overlay.innerHTML='<h1>🐾 GAME OVER!</h1><h2>Your tower: '+n+' m</h2><p>🏆 Best: '+best+' m</p><button id="again">PLAY AGAIN ▶</button><div id="shop">🎬 Watch ad for a heart: coming soon<br>🚫 No Ads $1.99: coming soon</div>';overlay.style.display='flex';document.querySelector('#again').onclick=start}
document.querySelector('#play').onclick=start;
function input(e){let r=c.getBoundingClientRect();moveX=Math.max(38,Math.min(W-38,e.clientX-r.left))}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);input(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')input(e)});
function drawAnimal(x,y,size,type,pose,ang=0){ctx.save();ctx.translate(x,y);ctx.rotate(ang);const a=animals[type],bounce=Math.sin(elapsed*5+pose)*2;ctx.translate(0,bounce);ctx.fillStyle='#6c5264';ctx.globalAlpha=.12;ctx.beginPath();ctx.ellipse(0,size*.43,size*.42,5,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=a[1];ctx.strokeStyle='#856d7a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,size*.49,size*.45,0,0,7);ctx.fill();ctx.stroke();ctx.font=(size*.63)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a[0],0,-size*.02);ctx.font=(size*.17)+'px sans-serif';ctx.fillText(['✨','💗','💤','🎵','⭐'][pose],size*.30,-size*.34);ctx.restore()}
function frame(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;baseX+=(moveX-baseX)*Math.min(1,dt*10);const size=Math.min(68,W*.16),step=size*.74,ground=H*.75,top=ground-tower.length*step+camera;camera+=(Math.max(0,tower.length*step-H*.48)-camera)*Math.min(1,dt*2);
if(fall){fall.y+=fall.speed*dt;fall.angle+=dt*.7;let landing=ground-tower.length*step+camera;if(fall.y+size*.43>=landing){let target=baseX+(tower.length?Math.sin(tower.length*1.8)*Math.min(19,tower.length*1.2):0);if(Math.abs(fall.x-target)<size*.78){tower.push({type:fall.type,pose:fall.pose,offset:fall.x-baseX,tilt:(fall.x-target)/size*.20});sound(animals[fall.type][2]);fall=null;spawn()}else if(fall.y>ground+camera+size){lives--;sound('growl');fall=null;if(lives<=0){end();return}spawn()}}}
ctx.clearRect(0,0,W,H);ctx.fillStyle='#b6e6a0';ctx.fillRect(0,ground+camera,W,H);ctx.fillStyle='#84ca82';ctx.fillRect(0,ground+camera,W,12);for(let i=0;i<22;i++){let x=(i*79+17)%W,y=ground+camera+16+(i*29)%90;ctx.fillStyle=i%2?'#f9b7c7':'#fff1b2';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
for(let i=0;i<tower.length;i++){let a=tower[i];drawAnimal(baseX+a.offset,ground-i*step-size*.43+camera,size,a.type,a.pose,a.tilt+Math.sin(elapsed*2+i)*.025)}
if(fall)drawAnimal(fall.x,fall.y,size,fall.type,fall.pose,Math.sin(fall.angle)*.22);
document.querySelector('#hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);document.querySelector('#score').textContent=tower.length+' m';requestAnimationFrame(frame)}
ctx.fillStyle='#8ed9ff';ctx.fillRect(0,0,W,H);
</script></html>
