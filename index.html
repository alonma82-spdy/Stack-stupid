index:1}#score{background:linear-gradient(#b0784d,#78482f);border:3px solid #d69a64;border-radius:12px;padding:9px 7px}#hint{color:white;text-shadow:0 2px #624767}#overlay:before{content:"";position:absolute;inset:35% 0 0;z-index:-1;background:linear-gradient(transparent,#65546d99),repeating-linear-gradient(90deg,#765f7899 0 35px,#95788a99 35px 55px);clip-path:polygon(0 57%,8% 57%,8% 39%,16% 39%,16% 63%,25% 63%,25% 48%,35% 48%,35% 58%,42% 58%,42% 30%,49% 30%,49% 60%,58% 60%,58% 40%,68% 40%,68% 55%,76% 55%,76% 35%,84% 35%,84% 52%,92% 52%,92% 43%,100% 43%,100% 100%,0 100%)} #wrap{background:linear-gradient(#62b4f7 0%,#a8d4f7 38%,#fbc4a7 69%,#846c8a 100%)}#hud{justify-content:center;gap:9px;top:8px}#hearts{position:absolute;right:10px;top:3px;font-size:17px}#score{min-width:145px;text-align:center;font-size:17px;background:linear-gradient(#ac7045,#70412d);border:3px solid #c88c55;border-radius:13px;box-shadow:inset 0 2px #f0ba81,0 4px #49324b}#combo{position:absolute;right:8px;top:39px;font-size:16px;color:#ffe071}#music{top:12px!important;left:8px!important;right:auto!important;border-radius:50%!important;padding:7px!important;background:linear-gradient(#90c4ff,#4b7cbe)!important;border:2px solid white!important;box-shadow:0 3px #385b9a!important}#hint{bottom:18px;color:white;text-shadow:0 2px #574267;font-size:13px}#overlay{z-index:3}#overlay h1{font-size:clamp(56px,14vw,78px);letter-spacing:-3px;color:#ff79b0;text-shadow:0 3px #fff,0 7px #a23c82,0 11px #643d70}#overlay button{font-size:24px}#overlay p{max-width:310px}#toast{z-index:2;font-style:italic;text-shadow:2px 3px #853969,0 0 7px white!important;color:#ffdf58!important}#shop{max-width:310px}</style><div id="wrap"><canvas id="game"></canvas><div id="hud"><span id="hearts">❤️❤️❤️</span><span id="score">0 pts · 0 m</span><span id="combo">✨ x1</span></div><button id="music" style="position:absolute;right:10px;top:55px;padding:8px 12px;font-size:15px;z-index:2">🔊</button><div id="toast" style="position:absolute;top:28%;width:100%;font-size:32px;font-weight:900;color:#ff5b91;text-shadow:2px 3px white;pointer-events:none"></div><div id="hint">Slide the pink blanket to catch the cuties!</div><div id="overlay"><h1>Stack<br>Stupid</h1><canvas id='menuArt' style='height:30vh;width:100%;pointer-events:none'></canvas><p>Catch adorable falling animals!<br>Build the tallest, wobbliest tower.<br>Miss 3 animals and it's game over.</p><button id="play">PLAY ▶</button><div id="shop">🚫 No Ads $1.99 (coming soon)<br>🎬 Rewarded ads (coming soon)</div></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),wrap=document.querySelector('#wrap'),overlay=document.querySelector('#overlay');let W=400,H=800,dpr=1,tower=[],fall=null,lives=3,running=false,baseX=200,moveX=200,last=0,elapsed=0,best=Number(localStorage.getItem('stackstupidbest')||0),camera=0,points=0,combo=0,streak=0,particles=[],toastTime=0,shake=0,musicOn=true,audio=null,nextBeat=0,beat=0;
const animals=[['🐱','#ffd0ab','meow'],['🐶','#cba780','woof'],['🐰','#fff0f6','squeak'],['🐼','#f7f7f7','puff'],['🐸','#a8eb96','ribbit'],['🦊','#ffbd83','yip'],['🐻','#c7a182','growl'],['🐨','#b7c8d1','puff'],['🐷','#ffbed3','oink'],['🐹','#efc69c','squeak']];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);baseX=moveX=W/2}addEventListener('resize',resize);resize();
function sound(type){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);let f={meow:560,woof:180,squeak:850,puff:290,ribbit:120,yip:700,growl:95,oink:260}[type]||400;o.type=type==='woof'||type==='growl'?'sawtooth':'sine';o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,a.currentTime+.18);g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.23);o.onended=()=>a.close()}catch(e){}}
function tone(freq,dur=.13,kind="sine",volume=.035){if(!audio||!musicOn)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.value=freq;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.start();o.stop(audio.currentTime+dur)}catch(e){}}

function celebrate(x,y,perfect){for(let i=0;i<(perfect?18:8);i++)particles.push({x,y,vx:(Math.random()-.5)*210,vy:-Math.random()*160-40,life:.6+Math.random()*.5,color:["#ff83ad","#fff0a0","#9ce2ff","#b7ed9b"][i%4]});document.querySelector("#toast").textContent=perfect?"✨ PERFECT! x"+Math.min(combo,8):combo>=3?"🔥 COMBO x"+Math.min(combo,8):"+100";toastTime=.75}
document.querySelector("#music").onclick=()=>{musicOn=!musicOn;document.querySelector("#music").textContent=musicOn?"🔊":"🔇";if(musicOn&&audio&&audio.state==="suspended")audio.resume()};
function spawn(){const type=Math.floor(Math.random()*animals.length);fall={x:35+Math.random()*(W-70),y:-55,type,pose:Math.floor(Math.random()*5),speed:90+tower.length*15,angle:Math.random()*1.2-0.6}}
function drawMenu(){let el=document.querySelector('#menuArt');if(!el)return;let w=el.clientWidth,hh=el.clientHeight;if(!w||!hh)return;el.width=w*2;el.height=hh*2;let g=el.getContext('2d');g.scale(2,2);g.fillStyle='#ff9bc1';g.beginPath();g.ellipse(w/2,hh*.91,w*.42,16,0,0,7);g.fill();for(let i=0;i<5;i++){let t=[3,2,0,1,7][i],im=sprites[t+':'+i]||(sprites[t+':'+i]=sprite(t,i));if(im.complete&&im.naturalWidth)g.drawImage(im,w/2-43+(i%2?16:-16),hh*.78-i*hh*.15-35,86,92)}if(!running&&overlay.style.display!=='none')requestAnimationFrame(drawMenu)}requestAnimationFrame(drawMenu);
function start(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}points=0;combo=0;streak=0;particles=[];nextBeat=0;beat=0;tower=[];fall=null;lives=3;camera=0;elapsed=0;baseX=moveX=W/2;running=true;overlay.style.display='none';spawn();last=performance.now();requestAnimationFrame(frame)}
function end(){running=false;let n=tower.length;best=Math.max(best,n);let bestScore=Math.max(points,Number(localStorage.getItem('stackstupidscore')||0));localStorage.setItem('stackstupidscore',bestScore);localStorage.setItem('stackstupidbest',best);overlay.innerHTML='<h1>🐾 GAME OVER!</h1><h2>⭐ '+points+' points</h2><p>🐾 Tower: '+n+' m · 🏆 Best height: '+best+' m<br>🥇 Best score: '+bestScore+'</p><button id="again">PLAY AGAIN ▶</button><div id="shop">🎬 Watch ad for a heart: coming soon<br>🚫 No Ads $1.99: coming soon</div>';overlay.style.display='flex';document.querySelector('#again').onclick=start}
document.querySelector('#play').onclick=start;
function input(e){let r=c.getBoundingClientRect();moveX=Math.max(38,Math.min(W-38,e.clientX-r.left))}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);input(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')input(e)});
const sprites={};
function sprite(t,p){const pal=[['#ffdbb5','#b87d5a'],['#e7c49d','#9e7155'],['#fff8f4','#d9b3b9'],['#fefefe','#55515d'],['#c5edb4','#80b375'],['#ffc39a','#bc7855'],['#d8b594','#956e52'],['#cbdde3','#839da7'],['#ffcfdf','#cf8ca4'],['#f4ddb7','#b8996d']];const [fur,edge]=pal[t];const ear=t===2?'<ellipse cx="28" cy="17" rx="11" ry="28" fill="'+fur+'" stroke="'+edge+'" stroke-width="2"/><ellipse cx="92" cy="17" rx="11" ry="28" fill="'+fur+'" stroke="'+edge+'" stroke-width="2"/><ellipse cx="28" cy="17" rx="5" ry="20" fill="#ffb0c4"/><ellipse cx="92" cy="17" rx="5" ry="20" fill="#ffb0c4"/>':(t===0||t===5)?'<path d="M16 51 L20 6 L45 33 M75 33 L100 6 L104 51" fill="'+fur+'" stroke="'+edge+'" stroke-width="3"/><path d="M25 28 L25 17 L38 34 M82 34 L95 17 L95 28" fill="#ffb6c7"/>':'<ellipse cx="26" cy="35" rx="19" ry="22" fill="'+fur+'" stroke="'+edge+'" stroke-width="3"/><ellipse cx="94" cy="35" rx="19" ry="22" fill="'+fur+'" stroke="'+edge+'" stroke-width="3"/><ellipse cx="26" cy="35" rx="10" ry="12" fill="#ffb8ca"/><ellipse cx="94" cy="35" rx="10" ry="12" fill="#ffb8ca"/>';const patches=t===3?'<ellipse cx="41" cy="64" rx="18" ry="22" fill="#55505d"/><ellipse cx="79" cy="64" rx="18" ry="22" fill="#55505d"/>':'';const eyes=p===3?'<path d="M31 67 Q42 56 53 67 M67 67 Q78 56 89 67" fill="none" stroke="#423442" stroke-width="4" stroke-linecap="round"/>':'<ellipse cx="42" cy="65" rx="12" ry="16" fill="#332b3b"/><ellipse cx="78" cy="65" rx="12" ry="16" fill="#332b3b"/><ellipse cx="38" cy="59" rx="5" ry="7" fill="#fff"/><ellipse cx="74" cy="59" rx="5" ry="7" fill="#fff"/>';const xml='<svg xmlns="http://www.w3.org/2000/svg" width="160" height="180" viewBox="0 0 120 140"><defs><radialGradient id="f"><stop stop-color="#fffaf4"/><stop offset=".5" stop-color="'+fur+'"/><stop offset="1" stop-color="'+edge+'"/></radialGradient></defs><g stroke-linejoin="round"><ellipse cx="60" cy="109" rx="41" ry="28" fill="url(#f)" stroke="'+edge+'" stroke-width="3"/><ellipse cx="24" cy="127" rx="15" ry="10" fill="'+fur+'" stroke="'+edge+'" stroke-width="2"/><ellipse cx="96" cy="127" rx="15" ry="10" fill="'+fur+'" stroke="'+edge+'" stroke-width="2"/>'+ear+'<ellipse cx="60" cy="68" rx="48" ry="44" fill="url(#f)" stroke="'+edge+'" stroke-width="3"/>'+patches+'<ellipse cx="60" cy="91" rx="24" ry="16" fill="#fff5ee"/>'+eyes+'<ellipse cx="23" cy="88" rx="9" ry="5" fill="#ffb0c1"/><ellipse cx="97" cy="88" rx="9" ry="5" fill="#ffb0c1"/><path d="M53 90 Q60 98 67 90" fill="none" stroke="#a16c7e" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="60" cy="84" rx="5" ry="3" fill="#9d7181"/><ellipse cx="23" cy="110" rx="13" ry="10" fill="'+fur+'" stroke="'+edge+'" stroke-width="2"/><ellipse cx="97" cy="110" rx="13" ry="10" fill="'+fur+'" stroke="'+edge+'" stroke-width="2"/><g fill="#ffc3d2"><circle cx="20" cy="111" r="2.5"/><circle cx="27" cy="111" r="2.5"/><circle cx="93" cy="111" r="2.5"/><circle cx="100" cy="111" r="2.5"/></g></g></svg>';const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);return img}
function drawAnimal(x,y,size,type,pose,ang=0){const k=type+':'+pose,img=sprites[k]||(sprites[k]=sprite(type,pose));ctx.save();ctx.translate(x,y);ctx.rotate(ang);let s=size*1.45;ctx.shadowColor='#785c7877';ctx.shadowBlur=7;ctx.shadowOffsetY=3;if(img.complete&&img.naturalWidth)ctx.drawImage(img,-s/2,-s*.67,s,s*1.12);ctx.restore()}
function drawBlanket(x,y,size){ctx.save();ctx.translate(x,y);let w=Math.min(W*.73,size*5.3),hh=23;ctx.shadowColor='#593d6b77';ctx.shadowBlur=13;ctx.shadowOffsetY=7;ctx.fillStyle='#ed81ab';ctx.beginPath();ctx.moveTo(-w/2+12,-8);ctx.quadraticCurveTo(-w/2,-13,-w/2,-1);ctx.quadraticCurveTo(-w/2+8,22,-w/2+30,19);ctx.quadraticCurveTo(0,32,w/2-30,19);ctx.quadraticCurveTo(w/2-8,22,w/2,-1);ctx.quadraticCurveTo(w/2,-13,w/2-12,-8);ctx.quadraticCurveTo(0,2,-w/2+12,-8);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#ffd5e3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-w/2+12,7);ctx.quadraticCurveTo(0,20,w/2-12,7);ctx.stroke();for(let i=-3;i<=3;i++){let px=i*w/9;ctx.fillStyle='#ffc7d9';ctx.font='18px serif';ctx.fillText('♥',px-7,10+Math.sin(i)*3)}ctx.fillStyle='#ffd9bb';ctx.beginPath();ctx.ellipse(-w/2+3,9,10,19,-.2,0,7);ctx.ellipse(w/2-3,9,10,19,.2,0,7);ctx.fill();ctx.restore()}
function drawCity(){let horizon=H*.75+camera;ctx.save();for(let layer=0;layer<3;layer++){let bh=layer===0?H*.22:layer===1?H*.16:H*.1;ctx.fillStyle=['#ad94b0aa','#947c9caa','#786982cc'][layer];for(let i=0;i<18;i++){let bw=30+(i*13+layer*19)%38,xx=i*39-35+layer*13,ht=bh*(.3+((i*7+layer*3)%10)/12);let y=horizon-ht+layer*22;ctx.fillRect(xx,y,bw,ht);ctx.fillStyle='#ffdcb688';for(let wx=xx+7;wx<xx+bw-3;wx+=11)for(let wy=y+12;wy<y+ht-6;wy+=17)if((wx+wy+i)%3<2)ctx.fillRect(wx,wy,3,5);ctx.fillStyle=['#ad94b0aa','#947c9caa','#786982cc'][layer]}}ctx.restore()}
function purr(){if(!audio)return;try{let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),l=audio.createOscillator(),lg=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(92,t);o.frequency.exponentialRampToValueAtTime(66,t+.4);l.frequency.value=25;lg.gain.value=.35;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.43);o.start(t);l.start(t);o.stop(t+.44);l.stop(t+.44)}catch(e){}}
function frame(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;nextBeat-=dt;if(nextBeat<=0){nextBeat=.38-Math.min(.1,tower.length*.003);let melody=[262,330,392,330,294,349,440,392,262,330,392,523,440,392,330,294];if(beat%2===0)tone(melody[Math.floor(beat/2)%melody.length],.15,"triangle",.022);if(beat%4===0)tone(130,.1,"sine",.028);beat++}toastTime-=dt;if(toastTime<=0)document.querySelector("#toast").textContent="";shake=Math.max(0,shake-dt*3);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);baseX+=(moveX-baseX)*Math.min(1,dt*10);const size=Math.min(68,W*.16),step=size*.74,ground=H*.75,top=ground-tower.length*step+camera;camera+=(Math.max(0,tower.length*step-H*.48)-camera)*Math.min(1,dt*2);
if(fall){fall.y+=fall.speed*dt;fall.angle+=dt*.7;let landing=ground-tower.length*step+camera;if(fall.y+size*.43>=landing){let target=baseX+(tower.length?Math.sin(tower.length*1.8)*Math.min(19,tower.length*1.2):0);if(Math.abs(fall.x-target)<(tower.length?size*.78:Math.min(W*.36,size*2.6))){let precision=Math.abs(fall.x-target),perfect=precision<size*.19;combo=perfect?combo+1:0;streak++;points+=100+(perfect?250:0)+(Math.min(combo,8)*50);tower.push({type:fall.type,pose:fall.pose,offset:fall.x-baseX,tilt:(fall.x-target)/size*.20});celebrate(fall.x,landing,perfect);purr();jingle(perfect);if(streak%10===0&&lives<3){lives++;document.querySelector("#toast").textContent="💖 BONUS HEART!";toastTime=1.3}fall=null;spawn()}else if(fall.y>ground+camera+size){lives--;combo=0;streak=0;shake=1;sound('growl');tone(110,.5,'sawtooth',.06);document.querySelector('#toast').textContent='💔 MISSED!';toastTime=.8;fall=null;if(lives<=0){end();return}spawn()}}}
ctx.clearRect(0,0,W,H);ctx.save();ctx.translate((Math.random()-.5)*shake*9,(Math.random()-.5)*shake*9);drawCity();ctx.fillStyle='#806d86';ctx.fillRect(0,ground+camera,W,H);ctx.fillStyle='#665771';ctx.fillRect(0,ground+camera,W,12);for(let i=0;i<22;i++){let x=(i*79+17)%W,y=ground+camera+16+(i*29)%90;ctx.fillStyle=i%2?'#f9b7c7':'#fff1b2';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
drawBlanket(baseX,ground+camera+size*.02,size);for(let i=0;i<tower.length;i++){let a=tower[i];drawAnimal(baseX+a.offset,ground-i*step-size*.43+camera,size,a.type,a.pose,a.tilt+Math.sin(elapsed*2+i)*.025)}
if(fall)drawAnimal(fall.x,fall.y,size,fall.type,fall.pose,Math.sin(fall.angle)*.22);
for(let p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,7,7)}ctx.globalAlpha=1;ctx.restore();document.querySelector('#combo').textContent=combo>=2?'🔥 x'+Math.min(combo,8):'✨ x1';document.querySelector('#hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);document.querySelector('#score').textContent=points+' pts · '+tower.length+' m';requestAnimationFrame(frame)}
ctx.fillStyle='#8ed9ff';ctx.fillRect(0,0,W,H);
