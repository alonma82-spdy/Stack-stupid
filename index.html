<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b7e8fa"><title>Stack Stupid 🐾</title><style>*{box-sizing:border-box}body{margin:0;background:#a9e3fa;font-family:system-ui;text-align:center;color:#543c62;touch-action:none}#wrap{position:relative;margin:auto;width:min(100vw,440px);height:100dvh;overflow:hidden;background:linear-gradient(#9ddfff 0%,#eaf9ff 72%,#b6e6a0 72%)}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-around;font-weight:900;font-size:21px;text-shadow:0 2px white;pointer-events:none}#overlay{position:absolute;inset:0;background:#ffffffbd;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}h1{font-size:40px;margin:5px;color:#fa658b;text-shadow:2px 3px white}button{border:0;border-radius:30px;background:#ff7eaa;color:white;padding:16px 32px;font-size:22px;font-weight:900;box-shadow:0 6px #d44e83;margin:8px}p{font-weight:650}#shop{font-size:14px;background:white;color:#654;border-radius:12px;padding:9px}#hint{position:absolute;bottom:10px;left:0;right:0;font-size:14px;font-weight:700;color:#674b72;pointer-events:none}</style><div id="wrap"><canvas id="game"></canvas><div id="hud"><span id="hearts">❤️❤️❤️</span><span id="score">0 pts · 0 m</span><span id="combo">✨ x1</span></div><button id="music" style="position:absolute;right:10px;top:55px;padding:8px 12px;font-size:15px;z-index:2">🔊</button><div id="toast" style="position:absolute;top:28%;width:100%;font-size:32px;font-weight:900;color:#ff5b91;text-shadow:2px 3px white;pointer-events:none"></div><div id="hint">Slide the pink blanket to catch the cuties!</div><div id="overlay"><h1>🐾 STACK STUPID!</h1><p>Catch adorable falling animals!<br>Build the tallest, wobbliest tower.<br>Miss 3 animals and it's game over.</p><button id="play">PLAY ▶</button><div id="shop">🚫 No Ads $1.99 (coming soon)<br>🎬 Rewarded ads (coming soon)</div></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),wrap=document.querySelector('#wrap'),overlay=document.querySelector('#overlay');let W=400,H=800,dpr=1,tower=[],fall=null,lives=3,running=false,baseX=200,moveX=200,last=0,elapsed=0,best=Number(localStorage.getItem('stackstupidbest')||0),camera=0,points=0,combo=0,streak=0,particles=[],toastTime=0,shake=0,musicOn=true,audio=null,nextBeat=0,beat=0;
const animals=[['🐱','#ffd0ab','meow'],['🐶','#cba780','woof'],['🐰','#fff0f6','squeak'],['🐼','#f7f7f7','puff'],['🐸','#a8eb96','ribbit'],['🦊','#ffbd83','yip'],['🐻','#c7a182','growl'],['🐨','#b7c8d1','puff'],['🐷','#ffbed3','oink'],['🐹','#efc69c','squeak']];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);baseX=moveX=W/2}addEventListener('resize',resize);resize();
function sound(type){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);let f={meow:560,woof:180,squeak:850,puff:290,ribbit:120,yip:700,growl:95,oink:260}[type]||400;o.type=type==='woof'||type==='growl'?'sawtooth':'sine';o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,a.currentTime+.18);g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.23);o.onended=()=>a.close()}catch(e){}}
function tone(freq,dur=.13,kind="sine",volume=.035){if(!audio||!musicOn)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.value=freq;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function jingle(perfect){let notes=perfect?[523,659,784,1047]:[392,523];notes.forEach((n,i)=>setTimeout(()=>tone(n,.16,"triangle",.055),i*65))}
function celebrate(x,y,perfect){for(let i=0;i<(perfect?18:8);i++)particles.push({x,y,vx:(Math.random()-.5)*210,vy:-Math.random()*160-40,life:.6+Math.random()*.5,color:["#ff83ad","#fff0a0","#9ce2ff","#b7ed9b"][i%4]});document.querySelector("#toast").textContent=perfect?"✨ PERFECT! x"+Math.min(combo,8):combo>=3?"🔥 COMBO x"+Math.min(combo,8):"+100";toastTime=.75}
document.querySelector("#music").onclick=()=>{musicOn=!musicOn;document.querySelector("#music").textContent=musicOn?"🔊":"🔇";if(musicOn&&audio&&audio.state==="suspended")audio.resume()};
function spawn(){const type=Math.floor(Math.random()*animals.length);fall={x:35+Math.random()*(W-70),y:-55,type,pose:Math.floor(Math.random()*5),speed:90+tower.length*15,angle:Math.random()*1.2-0.6}}
function start(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}points=0;combo=0;streak=0;particles=[];nextBeat=0;beat=0;tower=[];fall=null;lives=3;camera=0;elapsed=0;baseX=moveX=W/2;running=true;overlay.style.display='none';spawn();last=performance.now();requestAnimationFrame(frame)}
function end(){running=false;let n=tower.length;best=Math.max(best,n);let bestScore=Math.max(points,Number(localStorage.getItem('stackstupidscore')||0));localStorage.setItem('stackstupidscore',bestScore);localStorage.setItem('stackstupidbest',best);overlay.innerHTML='<h1>🐾 GAME OVER!</h1><h2>⭐ '+points+' points</h2><p>🐾 Tower: '+n+' m · 🏆 Best height: '+best+' m<br>🥇 Best score: '+bestScore+'</p><button id="again">PLAY AGAIN ▶</button><div id="shop">🎬 Watch ad for a heart: coming soon<br>🚫 No Ads $1.99: coming soon</div>';overlay.style.display='flex';document.querySelector('#again').onclick=start}
document.querySelector('#play').onclick=start;
function input(e){let r=c.getBoundingClientRect();moveX=Math.max(38,Math.min(W-38,e.clientX-r.left))}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);input(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')input(e)});
function drawAnimal(x,y,size,type,pose,ang=0){
const fur=['#ffdfb8','#e8bd92','#fff5f1','#fff9f6','#bdeba9','#ffbb8e','#cfa47d','#c5d7dc','#ffcad7','#f7d8a8'][type];
const trim=['#b98768','#a47c63','#d6aeb2','#555365','#7bb877','#c8845f','#987052','#829da7','#d78eaa','#c7a16d'][type];
const s=size/74;ctx.save();ctx.translate(x,y);ctx.rotate(ang+[-.08,.08,0,.1,-.07][pose%5]);ctx.scale(s,s);ctx.translate(0,Math.sin(elapsed*4+type)*1.4);
function ellipse(x,y,rx,ry,fill,stroke=null,sw=2){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}}
function path(points,fill,stroke=trim,sw=2){ctx.beginPath();ctx.moveTo(points[0],points[1]);for(let i=2;i<points.length;i+=2)ctx.lineTo(points[i],points[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke()}}
function curve(x1,y1,cx,cy,x2,y2,color=trim,w=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
ctx.shadowColor='#9d6b7c55';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
if(type!==2&&type!==3&&type!==4){curve(22,18,47,8,34,-12,trim,11);curve(22,18,47,8,34,-12,fur,7)}
ellipse(0,16,27,22,fur,trim,2);ellipse(-20,32,12,7,fur,trim);ellipse(20,32,12,7,fur,trim);
if(type===2){ellipse(-19,-30,10,28,fur,trim);ellipse(19,-30,10,28,fur,trim);ellipse(-19,-32,5,19,'#ffb4c8');ellipse(19,-32,5,19,'#ffb4c8')}
else if([0,5].includes(type)){path([-32,-12,-30,-41,-7,-29],fur);path([7,-29,30,-41,32,-12],fur);path([-27,-20,-26,-34,-14,-27],'#f8acb9',null);path([14,-27,26,-34,27,-20],'#f8acb9',null)}
else if(type===1){ellipse(-29,-19,12,23,trim);ellipse(29,-19,12,23,trim)}
else{ellipse(-25,-25,13,14,type===3?'#55505c':fur,trim);ellipse(25,-25,13,14,type===3?'#55505c':fur,trim);ellipse(-25,-25,7,8,'#f7b2c2');ellipse(25,-25,7,8,'#f7b2c2')}
ellipse(0,-8,34,30,fur,trim,2.4);ctx.shadowBlur=0;ctx.shadowOffsetY=0;
if(type===3){ellipse(-16,-13,12,17,'#57505c');ellipse(16,-13,12,17,'#57505c')}
if(type===5){ellipse(-18,-7,13,20,'#fff2dd');ellipse(18,-7,13,20,'#fff2dd')}
if(type===6){ellipse(-19,-27,9,8,'#b68a64');ellipse(19,-27,9,8,'#b68a64')}
ellipse(0,5,18,13,type===4?'#d8f5c9':'#fff3eb');
if(pose%5===3){curve(-23,-14,-15,-19,-7,-14,'#554a5a',2.8);curve(7,-14,15,-19,23,-14,'#554a5a',2.8)}
else{ellipse(-15,-14,8,10,'#3b3449');ellipse(15,-14,8,10,'#3b3449');ellipse(-17,-18,3.2,4.5,'white');ellipse(13,-18,3.2,4.5,'white');ellipse(-12,-10,1.4,2,'#b5a6c5');ellipse(18,-10,1.4,2,'#b5a6c5')}
ellipse(-26,1,6,3.6,'#ffb2bd');ellipse(26,1,6,3.6,'#ffb2bd');
if(type===8){ellipse(0,1,12,8,'#f59ab5');ellipse(-5,1,2,2.5,'#b66d85');ellipse(5,1,2,2.5,'#b66d85')}
else{ellipse(0,0,4,3,type===4?'#699f69':'#a47784');curve(0,3,-4,10,-8,5,'#a47784',1.8);curve(0,3,4,10,8,5,'#a47784',1.8)}
if(type===0||type===5){for(let side of [-1,1]){curve(side*18,3,side*27,1,side*34,2,trim,1.3);curve(side*18,7,side*29,9,side*33,12,trim,1.3)}}
if(pose%5===1)ellipse(-31,15,12,8,fur,trim);if(pose%5===4)ellipse(31,15,12,8,fur,trim);
ctx.restore()}
function drawBlanket(x,y,size){ctx.save();ctx.translate(x,y);let w=size*1.5;ctx.shadowColor='#6b607066';ctx.shadowBlur=10;ctx.shadowOffsetY=6;ctx.fillStyle='#fba7bb';ctx.beginPath();ctx.roundRect(-w/2,-7,w,20,10);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#fff8ed';ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(-w/2+8,5);ctx.lineTo(w/2-8,5);ctx.stroke();ctx.setLineDash([]);for(let i=-2;i<=2;i++){ctx.fillStyle='#fff3f6';ctx.beginPath();ctx.arc(i*w/6,-2,3,0,7);ctx.fill()}ctx.restore()}
function purr(){if(!audio)return;try{let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),l=audio.createOscillator(),lg=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(92,t);o.frequency.exponentialRampToValueAtTime(66,t+.4);l.frequency.value=25;lg.gain.value=.35;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.43);o.start(t);l.start(t);o.stop(t+.44);l.stop(t+.44)}catch(e){}}
function frame(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;nextBeat-=dt;if(nextBeat<=0){nextBeat=.38-Math.min(.1,tower.length*.003);let melody=[262,330,392,330,294,349,440,392,262,330,392,523,440,392,330,294];if(beat%2===0)tone(melody[Math.floor(beat/2)%melody.length],.15,"triangle",.022);if(beat%4===0)tone(130,.1,"sine",.028);beat++}toastTime-=dt;if(toastTime<=0)document.querySelector("#toast").textContent="";shake=Math.max(0,shake-dt*3);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);baseX+=(moveX-baseX)*Math.min(1,dt*10);const size=Math.min(68,W*.16),step=size*.74,ground=H*.75,top=ground-tower.length*step+camera;camera+=(Math.max(0,tower.length*step-H*.48)-camera)*Math.min(1,dt*2);
if(fall){fall.y+=fall.speed*dt;fall.angle+=dt*.7;let landing=ground-tower.length*step+camera;if(fall.y+size*.43>=landing){let target=baseX+(tower.length?Math.sin(tower.length*1.8)*Math.min(19,tower.length*1.2):0);if(Math.abs(fall.x-target)<size*.78){let precision=Math.abs(fall.x-target),perfect=precision<size*.19;combo=perfect?combo+1:0;streak++;points+=100+(perfect?250:0)+(Math.min(combo,8)*50);tower.push({type:fall.type,pose:fall.pose,offset:fall.x-baseX,tilt:(fall.x-target)/size*.20});celebrate(fall.x,landing,perfect);purr();jingle(perfect);if(streak%10===0&&lives<3){lives++;document.querySelector("#toast").textContent="💖 BONUS HEART!";toastTime=1.3}fall=null;spawn()}else if(fall.y>ground+camera+size){lives--;combo=0;streak=0;shake=1;sound('growl');tone(110,.5,'sawtooth',.06);document.querySelector('#toast').textContent='💔 MISSED!';toastTime=.8;fall=null;if(lives<=0){end();return}spawn()}}}
ctx.clearRect(0,0,W,H);ctx.save();ctx.translate((Math.random()-.5)*shake*9,(Math.random()-.5)*shake*9);ctx.fillStyle='#b6e6a0';ctx.fillRect(0,ground+camera,W,H);ctx.fillStyle='#84ca82';ctx.fillRect(0,ground+camera,W,12);for(let i=0;i<22;i++){let x=(i*79+17)%W,y=ground+camera+16+(i*29)%90;ctx.fillStyle=i%2?'#f9b7c7':'#fff1b2';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
drawBlanket(baseX,ground+camera+size*.02,size);for(let i=0;i<tower.length;i++){let a=tower[i];drawAnimal(baseX+a.offset,ground-i*step-size*.43+camera,size,a.type,a.pose,a.tilt+Math.sin(elapsed*2+i)*.025)}
if(fall)drawAnimal(fall.x,fall.y,size,fall.type,fall.pose,Math.sin(fall.angle)*.22);
for(let p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,7,7)}ctx.globalAlpha=1;ctx.restore();document.querySelector('#combo').textContent=combo>=2?'🔥 x'+Math.min(combo,8):'✨ x1';document.querySelector('#hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);document.querySelector('#score').textContent=points+' pts · '+tower.length+' m';requestAnimationFrame(frame)}
ctx.fillStyle='#8ed9ff';ctx.fillRect(0,0,W,H);
</script></html>
